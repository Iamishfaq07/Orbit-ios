name: Orbit
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
options:
  bundleIdPrefix: com.orbitanswer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  Orbit:
    type: application
    platform: iOS
    sources: [Orbit]
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ORBIT_API_URL: https://api.orbitanswer.com
        # Google sign-in stays hidden until GOOGLE_IOS_CLIENT_ID (below) is set to the iOS OAuth client id.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    entitlements:
      path: Orbit/Orbit.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitanswer.ios
        GOOGLE_IOS_CLIENT_ID: ""
        # The iOS client id reversed (com.googleusercontent.apps.<id>); a placeholder keeps the URL scheme valid.
        GOOGLE_REVERSED_CLIENT_ID: com.orbitanswer.ios.google-unconfigured
  OrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OrbitTests]
    dependencies:
      - target: Orbit
schemes:
  Orbit:
    build: { targets: { Orbit: all } }
    test: { targets: [OrbitTests] }
